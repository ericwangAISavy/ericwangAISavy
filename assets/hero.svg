  <circle cx="1014" cy="186" r="83" fill="none" stroke="#84c5c6" stroke-width="1" stroke-opacity=".28" stroke-dasharray="4 7"/>
  <circle cx="1014" cy="186" r="47" fill="none" stroke="#a2d7dc" stroke-width="1" stroke-opacity=".42"/>
  <path d="M896 186 H1132 M1014 68 V304" stroke="#72aab6" stroke-opacity=".19" stroke-width="1"/>
