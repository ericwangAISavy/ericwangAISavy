  <text x="686" y="42" fill="#7c919c" font-size="12" letter-spacing="1.7" font-family="Consolas, Menlo, monospace">APPLIED AI  •  SYSTEMS  •  INTERFACES</text>

  <text x="52" y="139" fill="#eaf1f1" font-size="68" letter-spacing="-3.5" font-family="Arial, Helvetica, sans-serif" font-weight="800">ENGINEERING</text>
  <text x="52" y="216" fill="url(#accent)" font-size="68" letter-spacing="-3.5" font-family="Arial, Helvetica, sans-serif" font-weight="800">INTELLIGENCE.</text>
