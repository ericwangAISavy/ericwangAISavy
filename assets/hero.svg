<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Eric Wang — Engineering intelligence</title>
  <desc id="desc">Dark editorial banner for the GitHub profile of Eric Wang, AI engineer and Twinlink founder, with a schematic orbit illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1219"/>
      <stop offset="0.55" stop-color="#101921"/>
      <stop offset="1" stop-color="#0a111a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9eefd5"/>
      <stop offset="1" stop-color="#8bcdff"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4e9b9d" stop-opacity=".42"/>
      <stop offset="1" stop-color="#66a2c4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#b8d5df" stroke-opacity=".065" stroke-width=".9"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1200" height="370" fill="url(#bg)"/>
  <rect width="1200" height="370" fill="url(#grid)"/>
  <ellipse cx="1000" cy="167" rx="180" ry="145" fill="#2c7e83" opacity=".085" filter="url(#soft)"/>
  <path d="M50 59 H1150" stroke="#b7c9d4" stroke-opacity=".20" stroke-width="1"/>
  <path d="M50 309 H1150" stroke="#b7c9d4" stroke-opacity=".20" stroke-width="1"/>
